<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
    <defs>
        <!-- Marker for sharp arrowhead -->
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1e3a8a"/>
        </marker>
    </defs>

    <!-- Background: Pure White -->
    <rect width="1000" height="600" fill="#ffffff"/>

    <!-- ========================================== -->
    <!-- CONNECTING ARROWS                          -->
    <!-- ========================================== -->
    <!-- Arrow 1: X1 -> Y -->
    <path d="M 368 124 L 655 245" stroke="#1e3a8a" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>

    <!-- Arrow 2: X2 -> Y (Straight horizontal) -->
    <path d="M 375 285 L 648 285" stroke="#1e3a8a" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>

    <!-- Arrow 3: X3 -> Y -->
    <path d="M 368 446 L 655 325" stroke="#1e3a8a" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>

    <!-- ========================================== -->
    <!-- HYPOTHESIS PILL BADGES (No filters for Word/PDF compatibility) -->
    <!-- ========================================== -->
    <!-- Badge 1: H1 -->
    <g id="badge-h1">
        <rect x="432" y="164" width="160" height="42" rx="6" ry="6" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.8"/>
        <text x="512" y="180" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#0f294a" text-anchor="middle">H₁ (+)</text>
        <text x="512" y="197" font-family="'Times New Roman', serif" font-size="11.5" font-style="italic" fill="#334155" text-anchor="middle">Positif &amp; Signifikan</text>
    </g>

    <!-- Badge 2: H2 -->
    <g id="badge-h2">
        <rect x="432" y="264" width="160" height="42" rx="6" ry="6" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.8"/>
        <text x="512" y="280" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#0f294a" text-anchor="middle">H₂ (+)</text>
        <text x="512" y="297" font-family="'Times New Roman', serif" font-size="11.5" font-style="italic" fill="#334155" text-anchor="middle">Positif &amp; Signifikan</text>
    </g>

    <!-- Badge 3: H3 -->
    <g id="badge-h3">
        <rect x="432" y="364" width="160" height="42" rx="6" ry="6" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.8"/>
        <text x="512" y="380" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#0f294a" text-anchor="middle">H₃ (+)</text>
        <text x="512" y="397" font-family="'Times New Roman', serif" font-size="11.5" font-style="italic" fill="#334155" text-anchor="middle">Positif &amp; Signifikan</text>
    </g>

    <!-- ========================================== -->
    <!-- OVAL X1: BRAND IMAGE                       -->
    <!-- ========================================== -->
    <g id="oval-x1">
        <ellipse cx="195" cy="100" rx="180" ry="84" fill="#f8faff" stroke="#1e3a8a" stroke-width="2.6"/>
        <text x="195" y="72" font-family="'Times New Roman', serif" font-size="15.5" font-weight="bold" fill="#0f294a" text-anchor="middle">BRAND IMAGE (X₁)</text>
        <line x1="110" y1="84" x2="280" y2="84" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,3"/>
        <text x="195" y="104" font-family="'Times New Roman', serif" font-size="11.5" fill="#1e293b" text-anchor="middle">- Citra Perusahaan (Corporate Image)</text>
        <text x="195" y="123" font-family="'Times New Roman', serif" font-size="11.5" fill="#1e293b" text-anchor="middle">- Citra Pengguna (User Image)</text>
        <text x="195" y="142" font-family="'Times New Roman', serif" font-size="11.5" fill="#1e293b" text-anchor="middle">- Citra Armada Listrik (Product Image)</text>
    </g>

    <!-- ========================================== -->
    <!-- OVAL X2: BRAND TRUST                       -->
    <!-- ========================================== -->
    <g id="oval-x2">
        <ellipse cx="195" cy="285" rx="180" ry="84" fill="#f8faff" stroke="#1e3a8a" stroke-width="2.6"/>
        <text x="195" y="257" font-family="'Times New Roman', serif" font-size="15.5" font-weight="bold" fill="#0f294a" text-anchor="middle">BRAND TRUST (X₂)</text>
        <line x1="110" y1="269" x2="280" y2="269" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,3"/>
        <text x="195" y="289" font-family="'Times New Roman', serif" font-size="11.5" fill="#1e293b" text-anchor="middle">- Keandalan Merek (Brand Reliability)</text>
        <text x="195" y="308" font-family="'Times New Roman', serif" font-size="11.5" fill="#1e293b" text-anchor="middle">- Itikad Baik &amp; Integritas (Benevolence)</text>
        <text x="195" y="327" font-family="'Times New Roman', serif" font-size="11.5" fill="#1e293b" text-anchor="middle">- Kompetensi Pengemudi (Driver Competence)</text>
    </g>

    <!-- ========================================== -->
    <!-- OVAL X3: PERCEIVED SAFETY                  -->
    <!-- ========================================== -->
    <g id="oval-x3">
        <ellipse cx="195" cy="470" rx="180" ry="84" fill="#f8faff" stroke="#1e3a8a" stroke-width="2.6"/>
        <text x="195" y="442" font-family="'Times New Roman', serif" font-size="15.5" font-weight="bold" fill="#0f294a" text-anchor="middle">PERCEIVED SAFETY (X₃)</text>
        <line x1="110" y1="454" x2="280" y2="454" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,3"/>
        <text x="195" y="474" font-family="'Times New Roman', serif" font-size="11.5" fill="#1e293b" text-anchor="middle">- Keselamatan Berkendara (Driving Safety)</text>
        <text x="195" y="493" font-family="'Times New Roman', serif" font-size="11.5" fill="#1e293b" text-anchor="middle">- Keamanan Pribadi (Personal Security)</text>
        <text x="195" y="512" font-family="'Times New Roman', serif" font-size="11.5" fill="#1e293b" text-anchor="middle">- Keandalan Teknis Armada Listrik (EV Safety)</text>
    </g>

    <!-- ========================================== -->
    <!-- OVAL Y: PURCHASE DECISION                  -->
    <!-- ========================================== -->
    <g id="oval-y">
        <ellipse cx="815" cy="285" rx="165" ry="145" fill="#f4faf5" stroke="#15803d" stroke-width="2.8"/>
        <text x="815" y="210" font-family="'Times New Roman', serif" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">PURCHASE DECISION (Y)</text>
        <text x="815" y="230" font-family="'Times New Roman', serif" font-size="11.5" font-style="italic" fill="#15803d" text-anchor="middle">Keputusan Pembelian &amp; Penggunaan Jasa</text>
        <line x1="725" y1="242" x2="905" y2="242" stroke="#86efac" stroke-width="1.2" stroke-dasharray="4,3"/>
        <text x="815" y="262" font-family="'Times New Roman', serif" font-size="11.5" fill="#1e293b" text-anchor="middle">- Kemantapan Menjatuhkan Pilihan</text>
        <text x="815" y="282" font-family="'Times New Roman', serif" font-size="11.5" fill="#1e293b" text-anchor="middle">- Kebiasaan Menggunakan Jasa</text>
        <text x="815" y="302" font-family="'Times New Roman', serif" font-size="11.5" fill="#1e293b" text-anchor="middle">- Rekomendasi kepada Pihak Lain</text>
        <text x="815" y="322" font-family="'Times New Roman', serif" font-size="11.5" fill="#1e293b" text-anchor="middle">- Komitmen Penggunaan Ulang (Repeat Usage)</text>
        <text x="815" y="342" font-family="'Times New Roman', serif" font-size="11.5" fill="#1e293b" text-anchor="middle">- Preferensi Mobilitas di Jakarta Barat</text>
    </g>

    <!-- ========================================== -->
    <!-- FOOTNOTE / SOURCE                          -->
    <!-- ========================================== -->
    <text x="500" y="582" font-family="'Times New Roman', serif" font-size="11" font-style="italic" fill="#64748b" text-anchor="middle">
        Sumber: Model Konseptual Penelitian, diadaptasi dari Kotler et al. (2022), Zeithaml et al. (2023), Tjiptono (2022), serta Studi Empiris Terdahulu (2026)
    </text>
</svg>
